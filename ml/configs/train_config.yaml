data:
  raw_path: "data/raw/claims_raw.csv"
  clean_path: "data/interim/claims_clean.csv"
  processed_path: "data/processed/claims_features.csv"

model:
  name: "XGBClassifier"
  params:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.08
    eval_metric: "logloss"
    random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42

artifacts:
  model_path: "models/model_v1.joblib"
  preprocessor_path: "artifacts/preprocessor.joblib"
  metrics_path: "artifacts/metrics.json"